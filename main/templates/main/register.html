{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share Thought</title>

    <script src="//unpkg.com/alpinejs" defer></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen flex bg-gray-100 text-gray-800">

    <!-- LEFT: Carousel -->
    <div 
      x-data="{
        current: 0,
        images: [
          '{% static "main/assets/image1.svg" %}',
          '{% static "main/assets/image2.svg" %}',
          '{% static "main/assets/image3.svg" %}'
        ]
      }"
      x-init="setInterval(() => current = (current + 1) % images.length, 3000)"
      class="hidden md:flex w-1/2 relative overflow-hidden border-r border-gray-300"
    >
      <template x-for="(img, index) in images" :key="index">
        <img 
          :src="img"
          x-show="current === index"
          class="absolute inset-0 w-full h-full object-cover grayscale"
        />
      </template>

      <!-- Overlay -->
      <div class="absolute inset-0 bg-white/60 flex items-center justify-center">
        <img class="w-1/2" src="{% static 'main/assets/logo.png' %}" alt="logo" />
      </div>
    </div>

    <!-- RIGHT: Form -->
    <div class="flex w-full md:w-1/2 items-center justify-center bg-white px-6">
      
      <div class="w-full max-w-md border border-gray-300 p-8 rounded-xl shadow-sm bg-white">

        <h2 class="text-2xl font-semibold mb-6 text-gray-900">
          Create Account
        </h2>

        {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            {% if 'register_msg' in message.tags %}
            <div class="p-3 rounded-lg text-sm {% if 'error' in message.tags %}bg-gray-900 text-white border border-gray-900{% else %}bg-gray-100 text-gray-800 border border-gray-300{% endif %}">
              {{ message }}
            </div>
            {% endif %}
          {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'register' %}" class="space-y-4">
          {% csrf_token %}

          <input 
            type="text" 
            name="username"
            placeholder="Username"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:outline-none focus:border-gray-600"
          />

          <input 
            type="email" 
            name="email"
            placeholder="Email"
            required
            class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:outline-none focus:border-gray-600"
          />

          <input 
            type="password" 
            name="password"
            placeholder="Password"
            required
            minlength="8"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 bg-white focus:outline-none focus:border-gray-600"
          />

          <button 
            type="submit"
            class="w-full border border-gray-800 text-gray-900 py-2 rounded-lg hover:bg-gray-900 hover:text-white transition"
          >
            Register
          </button>
        </form>

        <!-- Divider -->
        <div class="my-6 flex items-center">
          <div class="flex-grow h-px bg-gray-300"></div>
          <span class="px-3 text-gray-500 text-sm">OR</span>
          <div class="flex-grow h-px bg-gray-300"></div>
        </div>

        <!-- Login link -->
        <p class="text-sm text-gray-600 text-center">
          Already have an account?
          <a href="{% url 'login' %}" class="font-medium underline hover:text-black">
            Login
          </a>
        </p>

      </div>
    </div>

  </body>
</html>
